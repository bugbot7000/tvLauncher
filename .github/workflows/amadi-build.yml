name: Amadi TV build

on:
  push:
    branches: [amadi]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release signing key (optional)
        env:
          AMADI_KEYSTORE_BASE64: ${{ secrets.AMADI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${AMADI_KEYSTORE_BASE64:-}" ]; then
            echo -n "$AMADI_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "Using Amadi release key"
          else
            echo "::warning::AMADI_KEYSTORE_BASE64 secret not set. APK is signed with a temporary debug key; future builds will not install over it without uninstalling first."
          fi

      - run: flutter pub get

      - name: Build APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.AMADI_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AMADI_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AMADI_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --build-number=$((5000 + GITHUB_RUN_NUMBER)) \
            --build-name=amadi-${GITHUB_RUN_NUMBER}
          mkdir -p out
          cp build/app/outputs/flutter-apk/arc-launcher-universal-release.apk out/amadi-tv-${GITHUB_RUN_NUMBER}.apk 2>/dev/null \
            || find build/app/outputs -name 'arc-launcher-universal-*release.apk' -exec cp {} out/amadi-tv-${GITHUB_RUN_NUMBER}.apk \;
          # 32-bit ARM build for the room TVs (much smaller than the universal APK)
          find build/app/outputs -name 'arc-launcher-armeabi-v7a-*release.apk' -exec cp {} out/amadi-tv-${GITHUB_RUN_NUMBER}-armv7.apk \;
          ls -la out build/app/outputs/flutter-apk || true
          test -f out/amadi-tv-${GITHUB_RUN_NUMBER}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: amadi-tv-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amadi-build-${{ github.run_number }}
          name: Amadi TV build ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
